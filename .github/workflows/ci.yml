name: CI

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Action runtimes: Node 24+ (checkout/setup-node v7, artifact/cache Node24, codecov-action v6).
# Project Node for Angular/install jobs: 24 (matches engines ^24).
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - "**"
              - "!**/*.md"

  lint:
    name: fmt · clippy
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping heavy lint"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: make lint

  # Prefetch once; test + coverage download the artifact (sibling jobs cannot share a
  # cache fill from the same workflow run).
  wasmer-webc:
    name: wasmer webc
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTASHOP_WASMER_CACHE: ${{ github.workspace }}/.wasmer
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only placeholder
        if: needs.changes.outputs.code != 'true'
        run: |
          mkdir -p .wasmer/downloads
          echo skip > .wasmer/MARKDOWN_ONLY
      - name: Cache Wasmer packages
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: .wasmer
          key: wasmer-webc-${{ runner.os }}-v2
          restore-keys: |
            wasmer-webc-${{ runner.os }}-
      - name: Prefetch Wasmer webc
        if: needs.changes.outputs.code == 'true'
        run: bash scripts/prefetch-wasmer-webc.sh
      - name: Ensure uploadable Wasmer tree
        run: |
          mkdir -p .wasmer/downloads
          if [[ "${{ needs.changes.outputs.code }}" == "true" ]]; then
            test -s .wasmer/downloads/php-php-32.webc
            test -s .wasmer/downloads/python-python-0.1.0.webc
            test -s .wasmer/downloads/syrusakbary-quickjs.webc
          else
            test -f .wasmer/MARKDOWN_ONLY
          fi
          find .wasmer -type f -printf '%p %s\n'
      - name: Upload Wasmer cache
        uses: actions/upload-artifact@v6
        with:
          name: wasmer-webc
          path: .wasmer
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test:
    name: workspace tests
    needs: [changes, wasmer-webc]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rustashop
          POSTGRES_PASSWORD: rustashop
          POSTGRES_DB: rustashop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustashop -d rustashop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rustashop:rustashop@127.0.0.1:5432/rustashop
      RUSTASHOP_WASMER_CACHE: ${{ github.workspace }}/.wasmer
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping heavy tests"
      - uses: actions/download-artifact@v6
        if: needs.changes.outputs.code == 'true'
        with:
          name: wasmer-webc
          path: .wasmer
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: make test

  doc:
    name: rustdoc
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping rustdoc"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Doc
        if: needs.changes.outputs.code == 'true'
        run: make doc
      - name: Github pages
        if: >-
          needs.changes.outputs.code == 'true'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/dev'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs/api-rust
          branch: gh-pages
          clean: true
          commit-message: "Deploy documentation for ${{ github.sha }}"

  openapi:
    name: openapi dump
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping openapi"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: OpenAPI check
        if: needs.changes.outputs.code == 'true'
        run: make openapi-check

  shop-angular:
    name: shop-angular
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: shops/angular
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping shop-angular"
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: shops/angular/package-lock.json
      - name: Makefile shop-angular guards
        if: needs.changes.outputs.code == 'true'
        working-directory: .
        run: |
          # Proxy URL must not double the scheme (regression from sed wrapping).
          raw='127.0.0.1:8080'
          case "$raw" in http://*|https://*) p="${raw%/}" ;; *) p="http://${raw%/}" ;; esac
          test "$p" = "http://127.0.0.1:8080"
          raw='http://127.0.0.1:8081'
          case "$raw" in http://*|https://*) p="${raw%/}" ;; *) p="http://${raw%/}" ;; esac
          test "$p" = "http://127.0.0.1:8081"
          # ng serve no longer accepts --base-href; Make must not pass it.
          ! grep -nE 'npm start -- .*--base-href' Makefile
      - name: Install
        if: needs.changes.outputs.code == 'true'
        run: npm ci
      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: npm run lint
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: npm test
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: npm run build

  admin-angular:
    name: admin-angular
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin/angular
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping admin-angular"
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/angular/package-lock.json
      - name: Install
        if: needs.changes.outputs.code == 'true'
        run: npm ci
      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: npm run lint
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: npm test
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: npm run build

  install-ui:
    name: install-ui
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: install
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping install-ui"
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: install/package-lock.json
      - name: Install
        if: needs.changes.outputs.code == 'true'
        run: npm ci
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: npm test
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: npm run build

  supply-chain:
    name: supply-chain
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping supply-chain"
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Install cargo-audit and cargo-deny
        if: needs.changes.outputs.code == 'true'
        run: |
          cargo install --locked cargo-audit --version 0.22.0
          cargo install --locked cargo-deny --version 0.20.2
      - name: Cargo audit and deny
        if: needs.changes.outputs.code == 'true'
        run: make audit && make deny
      - name: npm audit shop
        if: needs.changes.outputs.code == 'true'
        working-directory: shops/angular
        run: npm ci && npm audit --audit-level=high --omit=dev && NPM_CONFIG_MIN_RELEASE_AGE=0 npx --yes --package=cve-lite-cli@1.33.0 cve-lite . --fail-on high
      - name: npm audit admin
        if: needs.changes.outputs.code == 'true'
        working-directory: admin/angular
        run: npm ci && npm audit --audit-level=high --omit=dev && NPM_CONFIG_MIN_RELEASE_AGE=0 npx --yes --package=cve-lite-cli@1.33.0 cve-lite . --fail-on high
      - name: npm audit install
        if: needs.changes.outputs.code == 'true'
        working-directory: install
        run: npm ci && npm audit --audit-level=high --omit=dev && NPM_CONFIG_MIN_RELEASE_AGE=0 npx --yes --package=cve-lite-cli@1.33.0 cve-lite . --fail-on high
      - name: Malware IoC scan
        if: needs.changes.outputs.code == 'true'
        run: node scripts/npm-malware-scan.mjs .

  coverage:
    name: coverage (rust)
    needs: [changes, wasmer-webc]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rustashop
          POSTGRES_PASSWORD: rustashop
          POSTGRES_DB: rustashop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustashop -d rustashop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rustashop:rustashop@127.0.0.1:5432/rustashop
      RUSTASHOP_WASMER_CACHE: ${{ github.workspace }}/.wasmer
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping coverage"
      - uses: actions/download-artifact@v6
        if: needs.changes.outputs.code == 'true'
        with:
          name: wasmer-webc
          path: .wasmer
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Install cargo-llvm-cov
        if: needs.changes.outputs.code == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage
        if: needs.changes.outputs.code == 'true'
        run: make coverage
      - name: Upload to Codecov
        if: needs.changes.outputs.code == 'true'
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov.info,coverage/lcov-seaorm.info
          flags: rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  coverage-js:
    name: coverage (javascript)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping coverage-js"
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: "24"
      - name: Coverage
        if: needs.changes.outputs.code == 'true'
        run: make coverage-js
      - name: Upload to Codecov
        if: needs.changes.outputs.code == 'true'
        uses: codecov/codecov-action@v6
        with:
          files: coverage/shop-lcov.info,coverage/admin-lcov.info,coverage/install-lcov.info
          flags: javascript
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
