[package]
name = "rustashop-api"
description = "Actix-web commerce API (OpenAPI via utoipa)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "rustashop-api"

[[bin]]
name = "rustashop-api"
path = "src/main.rs"

[[bin]]
name = "rustashop-openapi"
path = "src/bin/openapi.rs"

[[bin]]
name = "rustashop-install"
path = "src/bin/install.rs"

[features]
default = ["persist-sqlx"]
persist-sqlx = [
    "rustashop-persist/persist-sqlx",
    "dep:rustashop-persist-sqlx",
    "dep:sqlx",
]
persist-seaorm = [
    "rustashop-persist/persist-seaorm",
    "dep:rustashop-persist-seaorm",
    "dep:sea-orm",
]

[dependencies]
actix-web = { workspace = true }
actix-files = { workspace = true }
actix-ws = { workspace = true }
getrandom = "0.3"
rustashop = { workspace = true }
rustashop-domain = { workspace = true }
rustashop-persist = { workspace = true }
rustashop-persist-sqlx = { workspace = true, optional = true }
rustashop-persist-seaorm = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serenade-contracts = { workspace = true }
serenade-http = { workspace = true }
serenade-http-actix = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

[dev-dependencies]
actix-web = { workspace = true }
futures-util = "0.3"
insta = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rstest = { workspace = true }
serde_json = { workspace = true }
tokio-tungstenite = { workspace = true }

[lints]
workspace = true
