[package]
name = "rustashop-ops-gpui"
description = "rustashop native ops / logistics desktop client (GPUI)"
version = "0.1.0"
edition = "2024"
license = "OSL-3.0"
publish = false

# Standalone package (not a member of the rustashop workspace).
[workspace]

[[bin]]
name = "rustashop-ops-gpui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
gpui = "0.2.2"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "blocking",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "rustashop_ops_gpui"
path = "src/lib.rs"
