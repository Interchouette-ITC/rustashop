[package]
name = "rustashop-admin-tauri"
description = "rustashop admin desktop shell (Tauri 2 + Leptos admin wasm)"
version = "0.1.0"
edition = "2024"
license = "OSL-3.0"
publish = false

# Standalone package (not a member of the rustashop workspace).
[workspace]

[lib]
name = "rustashop_admin_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rustashop-admin-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
