services:
  postgres:
    image: postgres:16-alpine
    container_name: rustashop-postgres
    environment:
      POSTGRES_USER: rustashop
      POSTGRES_PASSWORD: rustashop
      POSTGRES_DB: rustashop
    ports:
      - "5432:5432"
    volumes:
      - rustashop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustashop -d rustashop"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: rustashop-api:local
    container_name: rustashop-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://rustashop:rustashop@postgres:5432/rustashop
    command: ["/app/rustashop-migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    profiles: ["messenger"]
    image: redis:7-alpine
    container_name: rustashop-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: rustashop-api:local
    container_name: rustashop-api
    environment:
      DATABASE_URL: postgres://rustashop:rustashop@postgres:5432/rustashop
      RUSTASHOP_BIND: 0.0.0.0:8080
      RUSTASHOP_ROOT: /app
      # Durable sandbox jobs (API must be built with messenger-redis):
      # RUSTASHOP_MESSENGER_REDIS_URL: redis://redis:6379/0
      # RUSTASHOP_MESSENGER_REDIS_LIST: rustashop:sandbox:jobs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  rustashop_pgdata:
