[package]
name = "rustashop-pos-gpui"
description = "rustashop native POS desktop client (GPUI)"
version = "0.1.0"
edition = "2024"
license = "OSL-3.0"
publish = false

# Standalone package (not a member of the rustashop workspace).
[workspace]

[[bin]]
name = "rustashop-pos-gpui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
gpui = "0.2.2"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "blocking",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "serde"] }

[lib]
name = "rustashop_pos_gpui"
path = "src/lib.rs"
