[workspace]
members = [
    "crates/rustashop",
    "crates/rustashop-domain",
    "crates/rustashop-persist",
    "crates/rustashop-persist-sqlx",
    "crates/rustashop-persist-seaorm",
    "crates/rustashop-persist-diesel",
    "crates/rustashop-extensions",
    "crates/rustashop-sandbox",
    "crates/rustashop-api",
    "crates/rustashop-mcp",
]
exclude = [
    "shops/leptos-rangular",
    "templates/shop/default",
    "extensions/fixtures/pricing-adjust",
    "extensions/fixtures/wasmer-quote-rust",
    "fuzz",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "OSL-3.0"
version = "0.1.0"
authors = ["Interchouette"]
repository = "https://github.com/Interchouette-ITC/rustashop"
rust-version = "1.95"

[workspace.dependencies]
rustashop = { path = "crates/rustashop", version = "0.1.0" }
rustashop-domain = { path = "crates/rustashop-domain", version = "0.1.0" }
rustashop-persist = { path = "crates/rustashop-persist", version = "0.1.0", default-features = false }
rustashop-persist-sqlx = { path = "crates/rustashop-persist-sqlx", version = "0.1.0" }
rustashop-persist-seaorm = { path = "crates/rustashop-persist-seaorm", version = "0.1.0" }
serenade-contracts = { git = "https://github.com/Interchouette-ITC/Serenade.git", branch = "dev" }
serenade-kernel = { git = "https://github.com/Interchouette-ITC/Serenade.git", branch = "dev" }
serenade-bundle = { git = "https://github.com/Interchouette-ITC/Serenade.git", branch = "dev" }
serenade-config = { git = "https://github.com/Interchouette-ITC/Serenade.git", branch = "dev" }
serenade-di = { git = "https://github.com/Interchouette-ITC/Serenade.git", branch = "dev" }
serenade-http = { git = "https://github.com/Interchouette-ITC/Serenade.git", branch = "dev" }
serenade-http-actix = { git = "https://github.com/Interchouette-ITC/Serenade.git", branch = "dev" }
# Pin until Serenade org `dev` includes the Wasm host crates.
serenade-component-host = { git = "https://github.com/Interchouette/Serenade.git", rev = "383a884f0acde6087b2ca631085600ea65dfb72f" }
serenade-sandbox = { git = "https://github.com/Interchouette/Serenade.git", rev = "383a884f0acde6087b2ca631085600ea65dfb72f" }
actix-web = "4"
actix-files = "0.6"
actix-ws = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls",
] }
sea-orm = { version = "2.0.2", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-chrono",
    "with-uuid",
] }
sea-orm-migration = { version = "2.0.2", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-chrono",
    "with-uuid",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = [
    "connect",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi"] }
utoipa = { version = "5", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web", "vendored"] }
rstest = "0.26"
mockall = "0.13"
insta = { version = "1", features = ["json"] }
wiremock = "0.6"
anyhow = "1"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "json",
] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
rmcp = { version = "3.1.2", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
schemars = "1"

[workspace.lints.rust]
missing_docs = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
